# Blank the screen after 10 minutes without input — but never while audio plays.
# No auto-suspend, no lock (user decision 2026-09-13).
#
# Why the audio guard: Chromium/Electron (Spotify) and Firefox (Zen) only inhibit
# idle for VIDEO, never audio-only. Music alone would otherwise let the screen blank.
# "dpms off" is not a lock — any input restores it instantly.
#
# SYNTAX: this Hyprland uses the Lua config, so `hyprctl dispatch` takes a Lua
# expression. The classic `hyprctl dispatch dpms off` is a Lua parse error here.
# Only pass "on"/"off": unrecognised args return `ok` but can toggle the screens.

general {
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout    = 600
    on-timeout = pactl list sink-inputs | grep -q "Corked: no" || hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
