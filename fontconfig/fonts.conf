<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Nexus font rules — written 2026-09-20.
  Fully reversible: delete this file and run `fc-cache -r`.
  Nothing here installs fonts; it only decides which installed font wins.
-->
<fontconfig>

  <!-- ============================================================
       1. Generic families.
       THE ONE LINE TO CHANGE: the first <family> under sans-serif
       is the machine-wide UI/body sans.
       ============================================================ -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>             <!-- UI sans -->
      <family>Noto Sans</family>          <!-- coverage fallback: Roboto is Latin/Cyrillic/Greek only -->
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- ============================================================
       2. CJK per language.
       Han unification means ja/zh/ko share code points; without these
       rules the first installed CJK font wins for all of them (it was
       the KOREAN one, so Japanese rendered with Korean glyph shapes).
       binding="strong" so the language match beats the app's own request.
       ============================================================ -->

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK JP</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK TC</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK KR</string></edit>
  </match>

  <!-- ============================================================
       3. Other scripts.
       These fell back to DejaVu / FreeSerif / FreeSans even though the
       matching Noto face is installed, because the system's
       65-nonlatin.conf prepends those. prepend puts Noto in front of them;
       binding="weak" so an app that explicitly names a font still wins.
       ============================================================ -->

  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Arabic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>he</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Hebrew</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>th</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Thai</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>hi</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Devanagari</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>bn</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Bengali</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ta</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Tamil</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Sinhala</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>am</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Ethiopic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ka</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Georgian</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>hy</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans Armenian</string></edit>
  </match>

  <!-- ============================================================
       4. Emoji last, for every family, so it is the final fallback
       and never steals normal text.
       ============================================================ -->

  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
  </match>

  <!-- Aptos: the Display / optical-heading cut also claims the plain "Aptos"
       family name, and won the generic match. Strip the alias so `Aptos`
       means Aptos Regular. Weights (Light/SemiBold/Black) keep their alias —
       that is how weight selection is supposed to work. -->
  <match target="scan">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign_replace"><string>Aptos Display</string></edit>
  </match>

</fontconfig>
